<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
        >

        <title>Girlie Outfit Game</title>
        <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="app-header">
        <h1>Girlie Outfit Game</h1>
        <p>Nena, ya puedes crear el outfit perfecto</p>
    </header>
        <main class="game-container">

        <aside class="wardrobe">
            <h2>Armario</h2>

            <div class="wardrobe-categories">
                <button
                    type="button"
                    class="category-button active"
                    data-category="tops"
                >
                    Tops
                </button>

                <button
                    type="button"
                    class="category-button"
                    data-category="bottoms"
                >
                    Bottoms
                </button>

                <button
                    type="button"
                    class="category-button"
                    data-category="shoes"
                >
                    Zapatos
                </button>

                <button
                    type="button"
                    class="category-button"
                    data-category="accessories"
                >
                    Accesorios
                </button>
            </div>

            <div id="wardrobe-items" class="wardrobe-items">
                <p>Selecciona una categoría</p>
            </div>
        </aside>

        <section class="dressing-room">
            <h2>Tu outfit</h2>

        <div class="mannequin">
            <img
                class="mannequin-base"
                src="assets/mannequin/mannequin.png"
                alt="Maniquí femenino"
            >
                <img id="bottoms-layer" class="outfit-layer" alt="" hidden>
                <img id="tops-layer" class="outfit-layer" alt="" hidden>
                <img id="shoes-layer" class="outfit-layer" alt="" hidden>
                <img id="accessories-layer" class="outfit-layer" alt="" hidden>
        </div>
        </section>

        <aside class="game-actions">
            <h2>Acciones</h2>

            <button type="button" id="random-button">
                Outfit aleatorio
            </button>

            <button type="button" id="reset-button">
                Reiniciar outfit
            </button>
        </aside>

    </main>
    <script src="js/outfit-data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
