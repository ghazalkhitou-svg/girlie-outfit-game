<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
        >

        <title>Girlie Outfit Game</title>
        <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="app-header">
        <h1>Girlie Outfit Game</h1>
        <p>Nena, ya puedes crear el outfit perfecto</p>
    </header>
        <main class="game-container">

        <aside class="wardrobe">
            <h2>Armario</h2>

            <button type="button">Tops</button>
            <button type="button">Bottoms</button>
            <button type="button">Zapatos</button>
            <button type="button">Accesorios</button>
        </aside>

        <section class="dressing-room">
            <h2>Tu outfit</h2>

            <div class="mannequin">
                <span class="mannequin-icon"></span>
                <p>Maniquí provisional</p>
            </div>
        </section>

        <aside class="game-actions">
            <h2>Acciones</h2>

            <button type="button" id="random-button">
                Outfit aleatorio
            </button>

            <button type="button" id="reset-button">
                Reiniciar outfit
            </button>
        </aside>

    </main>

    <script src="js/app.js"></script>
</body>
</html>
